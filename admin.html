<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bryce Beene - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f0e5;
            color: #0b2447;
        }

        .container {
            max-width: 80rem;
        }

        .section-title {
            position: relative;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            font-family: 'Lora', serif;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 4rem;
            height: 4px;
            background-color: #576f72;
            border-radius: 9999px;
        }

        .text-accent {
            color: #576f72;
        }

        .bg-primary {
            background-color: #0b2447;
        }

        .bg-secondary {
            background-color: #f8f0e5;
        }

        .bg-accent {
            background-color: #576f72;
        }

        .font-headline {
            font-family: 'Lora', serif;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <nav class="bg-primary sticky top-0 z-50 shadow-lg hidden" id="admin-nav">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center text-white">
            <a href="#" class="text-2xl font-bold font-headline tracking-widest text-white">BRYCE BEENE - ADMIN</a>
            <div class="flex space-x-4 items-center">
                <span id="user-email" class="font-semibold text-sm"></span>
                <a href="#emails"
                    class="px-3 py-2 hover:text-accent transition-colors duration-300 rounded-full">Emails</a>
                <a href="#epk" class="px-3 py-2 hover:text-accent transition-colors duration-300 rounded-full">EPK
                    Password</a>
                <a href="#admin-pass"
                    class="px-3 py-2 hover:text-accent transition-colors duration-300 rounded-full">Admin
                    Password</a>
                <button id="logout-button"
                    class="bg-red-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-red-600 transition-colors duration-300">Log
                    Out</button>
            </div>
        </div>
    </nav>

    <main id="admin-content" class="container mx-auto px-6 py-16 sm:px-12 hidden">
        <section id="emails" class="mb-16">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold section-title">Subscriber Emails</h2>
                <button id="download-csv-button"
                    class="bg-green-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-green-700 transition-colors duration-300">Download
                    CSV</button>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <div id="email-list" class="space-y-4">
                    <p class="text-gray-500 italic">Loading emails...</p>
                </div>
            </div>
        </section>

        <section id="epk" class="mb-16">
            <h2 class="text-3xl font-bold section-title mb-8">EPK Password Management</h2>
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <div class="space-y-4">
                    <h3 class="font-semibold text-lg">Change Password</h3>
                    <div id="password-form-wrapper">
                        <input type="password" id="new-password-input" placeholder="Enter new password"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-accent focus:border-accent transition-colors duration-300">
                        <button id="update-password-button"
                            class="bg-accent text-white px-6 py-2 rounded-full font-semibold hover:bg-accent/80 transition-colors duration-300">Update
                            Password</button>
                    </div>
                    <p id="password-message" class="mt-2 text-sm font-semibold text-green-700 hidden"></p>
                </div>
            </div>
        </section>

        <section id="admin-pass" class="mb-16">
            <h2 class="text-3xl font-bold section-title mb-8">Admin Password Management</h2>
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <div class="space-y-4">
                    <h3 class="font-semibold text-lg">Change Your Admin Password</h3>
                    <p class="text-gray-500 text-sm italic">
                        Note: You must have recently logged in for this to work.
                    </p>
                    <div id="admin-password-form-wrapper">
                        <input type="password" id="new-admin-password-input" placeholder="Enter new admin password"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-accent focus:border-accent transition-colors duration-300">
                        <button id="update-admin-password-button"
                            class="bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition-colors duration-300">
                            Update Admin Password
                        </button>
                    </div>
                    <p id="admin-password-message" class="mt-2 text-sm font-semibold hidden"></p>
                </div>
            </div>
        </section>
    </main>

    <main id="login-section" class="flex justify-center items-center min-h-screen">
        <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow-xl">
            <h2 class="text-3xl font-bold text-center section-title">Admin Login</h2>
            <form id="login-form" class="space-y-6">
                <div>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="w-full px-4 py-2 text-gray-900 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Email address">
                </div>
                <div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="w-full px-4 py-2 text-gray-900 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Password">
                </div>
                <div>
                    <button type="submit"
                        class="w-full px-4 py-2 text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Sign in
                    </button>
                </div>
            </form>
            <p id="error-message" class="text-red-500 text-center text-sm hidden"></p>
        </div>
    </main>


    <footer class="bg-primary text-white py-6 mt-16 text-center">
        <p>&copy; 2025 Bryce Beene. Admin Panel.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, onSnapshot, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const __app_id = "1:654657678235:web:8bd42df86f8c611f45cf3e";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDJxQj1GazWOhIuEHtg51safP3lxVAxBpA",
            authDomain: "bryce-beene-website.firebaseapp.com",
            projectId: "bryce-beene-website",
            storageBucket: "bryce-beene-website.firebasestorage.app",
            messagingSenderId: "654657678235",
            appId: __app_id
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = __app_id;

        let emailsData = []; // This variable will store the emails for CSV download

        // Get references to login form elements
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        // Get reference to the user email element
        const userEmailSpan = document.getElementById('user-email');

        // AUTH CHECK AND MAIN APP LOGIC
        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const adminContent = document.getElementById('admin-content');
            const adminNav = document.getElementById('admin-nav');

            if (user) {
                // User is signed in, show the admin content
                adminContent.classList.remove('hidden');
                adminNav.classList.remove('hidden');
                loginSection.classList.add('hidden');
                userEmailSpan.textContent = user.email;

                // Real-time listener for the emails
                const emailsCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'newsletter_emails');
                onSnapshot(emailsCollectionRef, (snapshot) => {
                    const emailListDiv = document.getElementById('email-list');
                    emailListDiv.innerHTML = '';
                    emailsData = []; // Clear the array before repopulating
                    if (snapshot.empty) {
                        emailListDiv.innerHTML = '<p class="text-gray-500 italic">No subscribers yet.</p>';
                    } else {
                        snapshot.forEach((doc) => {
                            const emailData = doc.data();
                            emailsData.push(emailData); // Store the data in our array
                            const emailElement = document.createElement('div');
                            emailElement.className = 'bg-gray-100 p-3 rounded-md shadow-sm';
                            emailElement.textContent = emailData.email;
                            emailListDiv.appendChild(emailElement);
                        });
                    }
                }, (error) => {
                    console.error("Error fetching emails. Full error object:", error);
                    document.getElementById('email-list').innerHTML = `<p class="text-red-500">Error loading emails: ${error.message}</p>`;
                });

            } else {
                // User is signed out, show the login section
                loginSection.classList.remove('hidden');
                adminContent.classList.add('hidden');
                adminNav.classList.add('hidden');
                userEmailSpan.textContent = '';
            }
        });

        // Event listener for login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMessage.classList.add('hidden');
            } catch (error) {
                console.error("Login failed:", error.message);
                errorMessage.textContent = 'Invalid email or password.';
                errorMessage.classList.remove('hidden');
            }
        });


        // Add this code to handle the logout button click
        const logoutButton = document.getElementById('logout-button');
        logoutButton.addEventListener('click', () => {
            signOut(auth).then(() => {
                // Sign-out successful. The onAuthStateChanged listener will handle the redirect.
            }).catch((error) => {
                // An error happened.
                console.error("Error signing out:", error);
            });
        });

        // Function to handle the CSV download
        function downloadEmailsAsCsv() {
            if (emailsData.length === 0) {
                alert("No emails to download.");
                return;
            }

            const header = "email\n";
            const csvContent = header + emailsData.map(e => e.email).join("\n");

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "bryce-beene-emails.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Event listener for the download button
        const downloadButton = document.getElementById('download-csv-button');
        if (downloadButton) {
            downloadButton.addEventListener('click', downloadEmailsAsCsv);
        }

        // ----------------------------------------------------
        // EPK PASSWORD UPDATE LOGIC
        // ----------------------------------------------------
        const newPasswordInput = document.getElementById('new-password-input');
        const updatePasswordButton = document.getElementById('update-password-button');
        const passwordMessage = document.getElementById('password-message');

        updatePasswordButton.addEventListener('click', async () => {
            const newPassword = newPasswordInput.value;
            if (newPassword.length === 0) {
                passwordMessage.textContent = 'Please enter a password.';
                passwordMessage.classList.remove('hidden');
                passwordMessage.classList.remove('text-green-700');
                passwordMessage.classList.add('text-red-500');
                return;
            }

            try {
                // Hash the new password using the existing function
                const hashedPassword = await sha256(newPassword);

                // Reference the specific document to update
                const passwordDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'epk', 'unreleased_password');

                // Update the 'hash' field in the document
                await setDoc(passwordDocRef, {
                    hash: hashedPassword
                });

                // Display success message
                passwordMessage.textContent = 'Password updated successfully!';
                passwordMessage.classList.remove('hidden', 'text-red-500');
                passwordMessage.classList.add('text-green-700');
                newPasswordInput.value = ''; // Clear the input field

                console.log("EPK password updated successfully.");

            } catch (error) {
                console.error("Error updating password:", error);
                passwordMessage.textContent = 'Error updating password: ' + error.message;
                passwordMessage.classList.remove('hidden', 'text-green-700');
                passwordMessage.classList.add('text-red-500');
            }
        });
        // ----------------------------------------------------
        // END OF EPK PASSWORD UPDATE LOGIC
        // ----------------------------------------------------

        // ----------------------------------------------------
        // ADMIN PASSWORD UPDATE LOGIC
        // ----------------------------------------------------
        const newAdminPasswordInput = document.getElementById('new-admin-password-input');
        const updateAdminPasswordButton = document.getElementById('update-admin-password-button');
        const adminPasswordMessage = document.getElementById('admin-password-message');

        updateAdminPasswordButton.addEventListener('click', async () => {
            const user = auth.currentUser;
            const newPassword = newAdminPasswordInput.value;

            if (!user) {
                adminPasswordMessage.textContent = 'You must be logged in to change your password.';
                adminPasswordMessage.classList.remove('hidden', 'text-green-700');
                adminPasswordMessage.classList.add('text-red-500');
                return;
            }

            if (newPassword.length < 6) {
                adminPasswordMessage.textContent = 'Password must be at least 6 characters long.';
                adminPasswordMessage.classList.remove('hidden', 'text-green-700');
                adminPasswordMessage.classList.add('text-red-500');
                return;
            }

            try {
                await updatePassword(user, newPassword);
                adminPasswordMessage.textContent = 'Admin password updated successfully!';
                adminPasswordMessage.classList.remove('hidden', 'text-red-500');
                adminPasswordMessage.classList.add('text-green-700');
                newAdminPasswordInput.value = ''; // Clear the input
            } catch (error) {
                console.error("Error updating admin password:", error);
                let errorMessageText = "Error: Please log out and log back in to change your password.";

                // You can check for a specific error code to give a better message
                if (error.code === 'auth/requires-recent-login') {
                    errorMessageText = "For security, please log out and log back in before changing your password.";
                }

                adminPasswordMessage.textContent = errorMessageText;
                adminPasswordMessage.classList.remove('hidden', 'text-green-700');
                adminPasswordMessage.classList.add('text-red-500');
            }
        });
        // ----------------------------------------------------
        // END OF ADMIN PASSWORD UPDATE LOGIC
        // ----------------------------------------------------


        // SHA256 hashing function
        async function sha256(str) {
            const textAsBuffer = new TextEncoder().encode(str);
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', textAsBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashedPassword = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashedPassword;
        }

        // DEBUGGING FUNCTION: Use this to check auth status in the console
        window.checkAuth = function () {
            const user = auth.currentUser;
            if (user) {
                console.log("Logged in user:", user.email);
            } else {
                console.log("No user is logged in.");
            }
        }
    </script>
</body>

</html>
